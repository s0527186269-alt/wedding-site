<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פאנל ניהול הזמנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.97 0.005 280);
  --card:oklch(1 0 0);
  --ink:oklch(0.25 0.02 285);
  --muted:oklch(0.52 0.015 285);
  --line:oklch(0.90 0.008 285);
  --accent:oklch(0.55 0.14 295);
  --gold:oklch(0.66 0.11 78);
  --danger:oklch(0.55 0.19 27);
  --head:"Heebo",system-ui,sans-serif;
  --body:"Assistant",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,monospace;background:oklch(0.94 0.01 285);padding:.1rem .4rem;border-radius:.25rem;font-size:.9em}

header{background:var(--card);border-bottom:1px solid var(--line);padding:.9rem 1.25rem;
  position:sticky;top:0;z-index:20}
.head{max-width:110rem;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
header h1{font-size:1.35rem}
header .sub{font-size:.85rem;color:var(--muted)}
.hactions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.status{border-radius:9999px;background:oklch(0.55 0.14 295 / .12);padding:.35rem 1rem;font-size:.85rem}

.btn{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;border-radius:.5rem;
  border:1px solid var(--line);background:var(--card);padding:.55rem .85rem;font-size:.88rem;
  transition:border-color .25s,filter .25s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.btn-primary:hover{filter:brightness(1.08);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.ico{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:110rem;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
@media(min-width:1100px){.wrap{grid-template-columns:15rem minmax(0,1fr) minmax(0,26rem)}}

/* לקוחות */
.cbtn{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:.75rem;
  background:var(--card);padding:.7rem .9rem;cursor:pointer;margin-bottom:.5rem;transition:border-color .25s}
.cbtn:hover{border-color:oklch(0.55 0.14 295 / .5)}
.cbtn.on{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.55 0.14 295 / .1)}
.cbtn .nm{display:block;font-weight:600;font-size:.9rem}
.cbtn .sl{display:block;font-size:.75rem;color:var(--muted);direction:ltr;text-align:right}
.pill{display:inline-block;margin-top:.35rem;border-radius:9999px;padding:.05rem .55rem;font-size:11px}
.pill.on{background:oklch(0.55 0.14 295 / .14)}
.pill.off{background:oklch(0.90 0.008 285);color:var(--muted)}

/* טופס */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:.9rem;padding:.85rem;margin-bottom:1rem}
.toolbar .url{margin-inline-start:auto;font-size:.75rem;color:var(--muted);
  display:flex;align-items:center;gap:.6rem}
.toolbar .url .draft{color:var(--muted);font-style:italic}
.btn-copy{border-color:var(--accent);color:var(--accent)}
.btn-copy:hover{background:var(--accent);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:.9rem;margin-bottom:1rem;overflow:hidden}
.sec > summary{cursor:pointer;padding:.85rem 1rem;font-family:var(--head);font-weight:700;font-size:.98rem;
  list-style:none;display:flex;align-items:center;justify-content:space-between}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:"▾";color:var(--muted);font-size:.8rem}
.sec[open] > summary{border-bottom:1px solid var(--line)}
.sec .body{padding:1rem}
.f{display:block;margin-bottom:.9rem}
.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.f input[type=text],.f textarea{width:100%;border:1px solid var(--line);border-radius:.5rem;
  background:var(--card);padding:.5rem .7rem;font-size:.9rem;outline:none;resize:none;transition:border-color .25s}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
.f .hint{display:block;margin-top:.25rem;font-size:.76rem;color:var(--muted);font-weight:400}
.filebtn{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;border:1px solid var(--line);
  border-radius:.5rem;padding:.45rem .8rem;font-size:.82rem;transition:border-color .25s}
.filebtn:hover{border-color:var(--accent)}
.strip{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
.strip img{height:3.5rem;border-radius:.35rem;object-fit:contain;background:oklch(0.2 0.03 300);padding:.25rem}
.strip audio{height:2.5rem;max-width:100%;flex:1 1 14rem}
.link{background:none;border:0;cursor:pointer;font-size:.78rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--danger)}

/* תצוגה מקדימה */
.preview{position:sticky;top:5rem;height:calc(100vh - 7rem);background:var(--card);
  border:1px solid var(--line);border-radius:.9rem;overflow:hidden;display:flex;flex-direction:column}
.preview .bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.6rem .85rem;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.preview iframe{flex:1;width:100%;border:0;background:oklch(0.12 0.042 318)}
@media(max-width:1099px){.preview{position:static;height:34rem}}

.full{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.full iframe{flex:1;width:100%;border:0}
.full .close{position:absolute;top:1rem;inset-inline-end:1rem;z-index:61}
</style>
</head>
<body>

<header>
  <div class="head">
    <div>
      <h1>פאנל ניהול הזמנות</h1>
      <p class="sub">כאן את בונה כל הזמנה. הלקוח מקבל רק את עמוד ההזמנה — בלי גישה לפאנל.</p>
    </div>
    <div class="hactions">
      <span class="status" id="status" hidden></span>
      <button class="btn" onclick="exportJson()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        גיבוי
      </button>
      <label class="btn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        שחזור
        <input type="file" accept="application/json" hidden onchange="importJson(this)">
      </label>
      <button class="btn" onclick="downloadInvitation()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        הורדת ההזמנה
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:.6rem;padding:.7rem" onclick="addClient()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      לקוח חדש
    </button>
    <div id="list"></div>
  </aside>

  <main id="editor"></main>

  <div class="preview">
    <div class="bar">
      <span>תצוגה מקדימה — כך הלקוח יראה</span>
      <button class="btn" style="padding:.3rem .6rem;font-size:.78rem" onclick="openFull()">מסך מלא</button>
    </div>
    <iframe id="pv" title="תצוגה מקדימה"></iframe>
  </div>
</div>

<div class="full" id="full" hidden>
  <button class="btn close" onclick="closeFull()">
    <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    סגירה
  </button>
  <iframe id="pvFull" title="תצוגה מלאה"></iframe>
</div>

<script>
/* ===== תבנית ההזמנה — הקובץ hazmana.html מוטמע כאן ===== */
/* ===== תבנית ההזמנה =====
   נטענת מהקובץ hazmana.html שיושב באותו אתר, כך שיש עותק אחד בלבד של התבנית.
   עריכה של hazmana.html משתקפת מיד גם בתצוגה המקדימה, גם בהורדה וגם בכתובת החיה. */
let TPL = "";
async function loadTemplate(){
  const r = await fetch('/hazmana.html', { cache: 'no-cache' });
  if(!r.ok) throw new Error('template');
  TPL = await r.text();
}

/* ===== מודל הלקוח ===== */
const blank = (slug, name) => ({
  __slug: slug, __name: name, __published: false,
  bsd: 'בס"ד', backgroundImage: "", backgroundTint: 55,
  monogramImage: "",
  verse: "קול חתן וקול כלה · קול ששון וקול שמחה · עוד ישמע בהרי יהודה ובחוצות ירושלים",
  invitationA: "", invitationB: "",
  dayLabel: "", hebrewDate: "", gregorianDate: "",
  countdownLabel: "בעוד:", targetDate: "",
  marryingLine: "", saveTheDate: "Save the date!",
  blessing: "", hosts: "", calendarLabel: "שמרו ביומן",
  whereQ: "איפה", whereInfo: "", whereBtn: "פתיחת מפה", mapAddress: "",
  whenQ: "מתי", whenInfo: "", whenBtn: "שמרו ביומן",
  howQ: "איך מגיעים", howInfo: "", howBtn: "פתיחת Waze",
  greetTitle: "ברכות ואיחולים", greetSub: "", notifyEmail: "",
  ctaText: "רוצים גם הזמנה כזו?", ctaEmail: "",
  musicUrl: "",
});

/* ===== נתוני דמו — משמשים רק כגיבוי אם אין עדיין חיבור לשרת ===== */
const demoClients = [
  Object.assign(blank("fein", "משפחת פיין"), {
    __published: true,
    dayLabel: "יום חמישי", hebrewDate: "ט׳ בכסלו תשפ״ז", gregorianDate: "19.11.26",
    targetDate: "2026-11-19T19:00",
    blessing: "בשבח והודיה לבורא עולם, שמחים להזמינכם לחגוג עמנו את שמחת נישואי ילדינו מנחם מענדל וחנה'לה — שתהיה השעה טובה ומוצלחת.",
    marryingLine: "מוטי ונחמי מתחתנים", hosts: "אברהם וגיטי פיין",
    whereInfo: "אולמי היכל הפאר\nרחוב הרב קוק 12, בני ברק",
    whenInfo: "יום חמישי, 19 בנובמבר 2026\nקבלת פנים 19:00 · חופה 20:00",
    howInfo: "חניה חופשית בחניון האולם\nהסעות יציאה מירושלים בשעה 17:30",
    greetSub: "הברכה תישלח ישירות למשפחת אברהם וגיטי פיין",
    musicUrl: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=solo-piano-melody-118392.mp3",
  }),
  Object.assign(blank("rozental", "משפחת רוזנטל"), {
    dayLabel: "יום חמישי", hebrewDate: "כ״ז בשבט תשפ״ז", gregorianDate: "04.02.27",
    targetDate: "2027-02-04T18:30", hosts: "יעקב ומרים רוזנטל",
    whereInfo: "אולמי הדר\nרחוב ז'בוטינסקי 5, ירושלים",
  }),
];

let clients = [];
let active = "";
const cur = () => clients.find(c => c.__slug === active);

/* ===== התחברות לשרת (מסד הנתונים) ===== */
function adminKey(){ return localStorage.getItem('admin_key') || ""; }
function apiHeaders(){ return { "content-type": "application/json", "X-Admin-Key": adminKey() }; }

function askKey(msg){
  const k = prompt(msg || "סיסמת הניהול שהוגדרה ב-Cloudflare (ADMIN_KEY):");
  if(k){ localStorage.setItem('admin_key', k.trim()); return true; }
  return false;
}

async function loadClients(){
  try{
    const r = await fetch('/api/clients', { headers: apiHeaders() });
    if(r.status === 401){
      if(askKey()) return loadClients();
      clients = demoClients; active = clients[0].__slug;
      renderList(); renderEditor(); refreshPreview();
      return;
    }
    if(!r.ok) throw new Error("bad status");
    const data = await r.json();
    clients = (Array.isArray(data) && data.length) ? data : demoClients;
  }catch(e){
    clients = demoClients;
    flash("לא הצלחתי להתחבר לשרת — עובד במצב מקומי בלבד");
  }
  // זוכרים תחת איזו כתובת כל לקוח נשמר, כדי לזהות שינוי כתובת בהמשך
  clients.forEach(c => { c.__saved = c.__slug; });
  active = clients[0]?.__slug ?? "";
  renderList(); renderEditor(); refreshPreview();
}

async function saveActive(){
  const c = cur(); if(!c) return;
  const slug = slugify(c.__slug || "");
  if(!slug){ flash("כתובת ההזמנה חייבת להכיל אותיות אנגליות"); return; }
  if(clients.some(o => o !== c && o.__slug === slug)){ flash("כתובת זו כבר תפוסה"); return; }
  if(c.__slug !== slug) set('__slug', slug, true);

  const body = Object.assign({}, c, { __prevSlug: c.__saved || "" });
  delete body.__saved;
  try{
    const r = await fetch('/api/clients', { method: "POST", headers: apiHeaders(), body: JSON.stringify(body) });
    if(r.status === 401){ if(askKey()) return saveActive(); throw new Error("unauthorized"); }
    if(!r.ok) throw new Error("bad status");
    c.__saved = slug;
    renderList();
    flash("נשמר בשרת");
  }catch(e){
    flash("השמירה נכשלה — בדקי חיבור לאינטרנט או סיסמת ניהול");
  }
}

async function deleteActiveOnServer(slug){
  try{
    const r = await fetch('/api/clients/' + encodeURIComponent(slug), { method: "DELETE", headers: apiHeaders() });
    if(r.status === 401){ if(askKey()) return deleteActiveOnServer(slug); }
  }catch(e){ /* מתעלמים — מספיק שנמחק מקומית */ }
}

async function loadGuests(){
  const c = cur(); if(!c) return;
  try{
    const r = await fetch('/api/guests?slug=' + encodeURIComponent(c.__slug), { headers: apiHeaders() });
    if(r.status === 401){ if(askKey()) return loadGuests(); return; }
    if(!r.ok) throw new Error("bad status");
    const list = await r.json();
    if(!list.length){ flash("עדיין לא התקבלו ברכות עבור " + c.__name); return; }
    showGuests(c, list);
  }catch(e){
    flash("לא הצלחתי לטעון את הברכות");
  }
}

// תאריך קריא בעברית; אם הערך פגום מציגים אותו כמו שהוא ולא שוברים את הדף
function niceDate(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso || "");
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* עמוד ברכות להדפסה — נפתח בחלון נפרד, מעוצב לנייר A4 */
function showGuests(c, list){
  const w = window.open("", "_blank");
  if(!w){ flash("הדפדפן חסם את החלון. אפשרי חלונות קופצים לאתר ונסי שוב."); return; }

  const rows = list.map(g => `<article>
      <header><h2>${esc(g.name)}</h2><time>${esc(niceDate(g.created_at))}</time></header>
      <p>${esc(g.message).replace(/\n/g, "<br>")}</p>
    </article>`).join("");

  const plain = list.map(g => `${g.name} — ${niceDate(g.created_at)}\n${g.message}`).join("\n\n———\n\n");

  w.document.write(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>ברכות — ${esc(c.__name)}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1.5rem;background:#f6f4f0;color:#1c1a24;
    font:16px/1.65 "Assistant","Segoe UI",system-ui,sans-serif}
  .sheet{max-width:46rem;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 .25rem}
  .sub{color:#6b6577;font-size:.9rem;margin:0 0 1.5rem}
  .bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.75rem}
  button{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid #c9c3d4;
    background:#fff;color:#1c1a24;border-radius:.4rem;padding:.5rem .95rem}
  button:hover{border-color:#8a7fb0}
  article{background:#fff;border:1px solid #e2ddea;border-radius:.5rem;
    padding:1rem 1.15rem;margin-bottom:.9rem;break-inside:avoid}
  header{display:flex;justify-content:space-between;align-items:baseline;
    gap:1rem;margin-bottom:.4rem}
  h2{font-size:1.02rem;margin:0}
  time{color:#7a7488;font-size:.8rem;white-space:nowrap}
  p{margin:0;white-space:pre-wrap}
  @media print{
    body{background:#fff;padding:0}
    .bar{display:none}
    article{border-color:#ccc;box-shadow:none}
  }
</style></head><body><div class="sheet">
  <h1>ברכות ואיחולים — ${esc(c.__name)}</h1>
  <p class="sub">${list.length} ברכות · הופק ב-${esc(niceDate(new Date().toISOString()))}</p>
  <div class="bar">
    <button onclick="print()">הדפסה / שמירה כ-PDF</button>
    <button onclick="dl()">הורדה כקובץ טקסט</button>
  </div>
  ${rows}
</div>
<script>
  var TXT = ${JSON.stringify(plain)};
  var NAME = ${JSON.stringify("ברכות - " + c.__name + ".txt")};
  function dl(){
    var b = new Blob([TXT], {type:"text/plain;charset=utf-8"});
    var u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = NAME; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
  }
<\/script></body></html>`);
  w.document.close();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function copyLink(){
  const c = cur(); if(!c) return;
  const url = location.origin + "/i/" + c.__slug;
  try{
    await navigator.clipboard.writeText(url);
    flash("הקישור הועתק");
  }catch(e){
    // דפדפנים ישנים, או דף שלא נטען ב-https — נופלים לשיטה הידנית
    const ta = document.createElement("textarea");
    ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); flash("הקישור הועתק"); }
    catch(_){ prompt("העתיקי את הקישור:", url); }
    ta.remove();
  }
}

function flash(msg){
  const el = document.getElementById('status');
  el.textContent = msg; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.hidden = true; }, 2800);
}
const slugify = v => v.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");

/* ===== בניית מסמך ההזמנה ===== */
function buildDoc(c){
  if(!c) return "<p style=\"font-family:sans-serif;padding:2rem;direction:rtl\">בחרי לקוח</p>";
  if(!TPL) return "<p style=\"font-family:sans-serif;padding:2rem;direction:rtl\">התבנית עדיין נטענת…</p>";
  const d = {}; Object.keys(c).forEach(k => { if(!k.startsWith("__")) d[k] = c[k]; });
  // פונקציה כתחליף (ולא מחרוזת) — אחרת תו $ בטקסט של הלקוח יפורש כהוראה מיוחדת
  const payload = "const data = " + JSON.stringify(d) + ";";
  return TPL.replace(/\/\*__DATA_START__\*\/[\s\S]*?\/\*__DATA_END__\*\//, () => payload);
}
let pvTimer = null;
function refreshPreview(){
  clearTimeout(pvTimer);
  pvTimer = setTimeout(()=>{ document.getElementById('pv').srcdoc = buildDoc(cur()); }, 250);
}
function openFull(){

/* ===== רשימת לקוחות ===== */
function renderList(){
  document.getElementById('list').innerHTML = clients.map(c => `
    <button class="cbtn ${c.__slug===active?'on':''}" onclick="select('${c.__slug}')">

}
function select(slug){ active = slug; renderList(); renderEditor(); refreshPreview(); }
async function addClient(){
  const name = prompt("שם הלקוח (לשימוש פנימי):"); if(!name) return;
  const slug = slugify(prompt("כתובת ההזמנה (אנגלית):", slugify(name)) || ""); if(!slug) return;
  if(clients.some(c=>c.__slug===slug)){ alert("כתובת זו כבר תפוסה"); return; }
  clients.push(blank(slug, name)); select(slug);
  await saveActive();
}
function removeClient(){
  if(!confirm("למחוק את ההזמנה?")) return;
  const slug = active;
  clients = clients.filter(c=>c.__slug!==slug);
  active = clients[0]?.__slug ?? "";
  renderList(); renderEditor(); refreshPreview();
  deleteActiveOnServer(slug);
}

/* ===== שדות ===== */
function set(key, value, rebuild){
  const c = cur(); if(!c) return;
  c[key] = value;
  // הכתובת היא גם המפתח שלפיו מאתרים את הלקוח הפעיל — צריך לעדכן את שניהם יחד
  if(key === "__slug") active = value;
  if(key === "__name" || key === "__published" || key === "__slug") renderList();
  refreshPreview();
  if(rebuild) renderEditor();
}
const F = (label, key, hint, rows) => {

  const input = rows
    ? `<textarea rows="${rows}" oninput="set('${key}',this.value)">${v}</textarea>`

};

/* ===== העלאת תמונות =====
   התמונות לא נשמרות בתוך מסד הנתונים אלא באחסון הקבצים (R2), ובמסד נשמרת רק הכתובת.
   כך שורת הלקוח נשארת קטנה, וההזמנה שהאורח פותח נטענת מהר גם ברשת סלולרית. */

// מקטינים את התמונה בדפדפן לפני ההעלאה — חוסך משקל בלי שינוי נראה לעין
async function shrink(file){
  if(file.type === "image/svg+xml" || file.type === "image/gif") return file;
  const bmp = await createImageBitmap(file).catch(() => null);
  if(!bmp) return file;
  const MAX = 1800;
  const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  // PNG ו-WebP נשמרים כמות שהם כדי לא לאבד שקיפות (חשוב למונוגרמה)
  const keepAlpha = file.type === "image/png" || file.type === "image/webp";
  const out = await new Promise(res => cv.toBlob(res, keepAlpha ? "image/png" : "image/jpeg", 0.82));
  if(!out) return file;
  return out.size < file.size ? out : file;
}

async function uploadFile(slug, key, blob){
  const type = blob.type || "application/octet-stream";
  const r = await fetch(`/api/upload?slug=${encodeURIComponent(slug)}&field=${encodeURIComponent(key)}`, {
    method: "POST",
    headers: { "content-type": type, "X-Admin-Key": adminKey() },
    body: blob
  });
  if(r.status === 401){
    if(askKey()) return uploadFile(slug, key, blob);
    throw new Error("unauthorized");
  }
  if(r.status === 413) throw new Error("הקובץ גדול מדי");
  if(r.status === 415) throw new Error("סוג קובץ לא נתמך");
  if(!r.ok) throw new Error("upload failed");
  const out = await r.json();
  return out.url;
}

async function pick(input, key){
  const f = input.files && input.files[0]; if(!f) return;
  input.value = "";
  const c = cur(); if(!c) return;
  if(!c.__saved){ flash("שמרי את הלקוח פעם אחת לפני העלאת תמונות"); return; }
  flash("מעלה את התמונה…");
  try{
    const blob = await shrink(f);
    const url = await uploadFile(c.__slug, key, blob);
    set(key, url, true);
    await saveActive();
  }catch(e){
    flash(e && e.message && e.message !== "upload failed" ? e.message : "העלאת התמונה נכשלה");
  }
}

// אודיו עולה כמו שהוא — אין דחיסה בדפדפן כמו בתמונות, ולכן הקובץ נשלח במלואו
async function pickAudio(input, key){
  const f = input.files && input.files[0]; if(!f) return;
  input.value = "";
  const c = cur(); if(!c) return;
  if(!c.__saved){ flash("שמרי את הלקוח פעם אחת לפני העלאת קבצים"); return; }
  if(f.size > 20_000_000){ flash("הקובץ גדול מדי — עד 20MB"); return; }
  flash("מעלה את המוזיקה… זה עשוי לקחת רגע");
  try{
    const url = await uploadFile(c.__slug, key, f);
    set(key, url, true);
    await saveActive();
    flash("המוזיקה הועלתה");
  }catch(e){
    flash(e && e.message && e.message !== "upload failed" ? e.message : "העלאת המוזיקה נכשלה");
  }
}

/* ===== גיבוי ===== */
function exportJson(){
  const blob = new Blob([JSON.stringify(clients, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = "clients.json"; a.click();
  URL.revokeObjectURL(a.href); flash("הגיבוי ירד");
}
function importJson(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(String(r.result));
      if(!Array.isArray(parsed)) throw 0;
      clients = parsed;
      clients.forEach(c => { c.__saved = c.__slug; });
      active = clients[0]?.__slug ?? "";
      renderList(); renderEditor(); refreshPreview(); flash("היבוא הושלם");
    }catch{ flash("קובץ לא תקין"); }
  };
  r.readAsText(f);
}

loadTemplate()
