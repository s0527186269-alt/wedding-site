<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פאנל ניהול הזמנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.97 0.005 280);
  --card:oklch(1 0 0);
  --ink:oklch(0.25 0.02 285);
  --muted:oklch(0.52 0.015 285);
  --line:oklch(0.90 0.008 285);
  --accent:oklch(0.55 0.14 295);
  --gold:oklch(0.66 0.11 78);
  --danger:oklch(0.55 0.19 27);
  --head:"Heebo",system-ui,sans-serif;
  --body:"Assistant",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,monospace;background:oklch(0.94 0.01 285);padding:.1rem .4rem;border-radius:.25rem;font-size:.9em}

header{background:var(--card);border-bottom:1px solid var(--line);padding:.9rem 1.25rem;
  position:sticky;top:0;z-index:20}
.head{max-width:110rem;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
header h1{font-size:1.35rem}
header .sub{font-size:.85rem;color:var(--muted)}
.hactions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.status{border-radius:9999px;background:oklch(0.55 0.14 295 / .12);padding:.35rem 1rem;font-size:.85rem}

.btn{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;border-radius:.5rem;
  border:1px solid var(--line);background:var(--card);padding:.55rem .85rem;font-size:.88rem;
  transition:border-color .25s,filter .25s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.btn-primary:hover{filter:brightness(1.08);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.ico{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:110rem;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
@media(min-width:1100px){.wrap{grid-template-columns:15rem minmax(0,1fr) minmax(0,26rem)}}

/* לקוחות */
.cbtn{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:.75rem;
  background:var(--card);padding:.7rem .9rem;cursor:pointer;margin-bottom:.5rem;transition:border-color .25s}
.cbtn:hover{border-color:oklch(0.55 0.14 295 / .5)}
.cbtn.on{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.55 0.14 295 / .1)}
.cbtn .nm{display:block;font-weight:600;font-size:.9rem}
.cbtn .sl{display:block;font-size:.75rem;color:var(--muted);direction:ltr;text-align:right}
.pill{display:inline-block;margin-top:.35rem;border-radius:9999px;padding:.05rem .55rem;font-size:11px}
.pill.on{background:oklch(0.55 0.14 295 / .14)}
.pill.off{background:oklch(0.90 0.008 285);color:var(--muted)}

/* טופס */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:.9rem;padding:.85rem;margin-bottom:1rem}
.toolbar .url{margin-inline-start:auto;font-size:.75rem;color:var(--muted);direction:ltr}
.sec{background:var(--card);border:1px solid var(--line);border-radius:.9rem;margin-bottom:1rem;overflow:hidden}
.sec > summary{cursor:pointer;padding:.85rem 1rem;font-family:var(--head);font-weight:700;font-size:.98rem;
  list-style:none;display:flex;align-items:center;justify-content:space-between}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:"▾";color:var(--muted);font-size:.8rem}
.sec[open] > summary{border-bottom:1px solid var(--line)}
.sec .body{padding:1rem}
.f{display:block;margin-bottom:.9rem}
.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.f input[type=text],.f textarea{width:100%;border:1px solid var(--line);border-radius:.5rem;
  background:var(--card);padding:.5rem .7rem;font-size:.9rem;outline:none;resize:none;transition:border-color .25s}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
.f .hint{display:block;margin-top:.25rem;font-size:.76rem;color:var(--muted);font-weight:400}
.filebtn{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;border:1px solid var(--line);
  border-radius:.5rem;padding:.45rem .8rem;font-size:.82rem;transition:border-color .25s}
.filebtn:hover{border-color:var(--accent)}
.strip{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
.strip img{height:3.5rem;border-radius:.35rem;object-fit:contain;background:oklch(0.2 0.03 300);padding:.25rem}
.link{background:none;border:0;cursor:pointer;font-size:.78rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--danger)}

/* תצוגה מקדימה */
.preview{position:sticky;top:5rem;height:calc(100vh - 7rem);background:var(--card);
  border:1px solid var(--line);border-radius:.9rem;overflow:hidden;display:flex;flex-direction:column}
.preview .bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.6rem .85rem;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.preview iframe{flex:1;width:100%;border:0;background:oklch(0.12 0.042 318)}
@media(max-width:1099px){.preview{position:static;height:34rem}}

.full{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.full iframe{flex:1;width:100%;border:0}
.full .close{position:absolute;top:1rem;inset-inline-end:1rem;z-index:61}
</style>
</head>
<body>

<header>
  <div class="head">
    <div>
      <h1>פאנל ניהול הזמנות</h1>
      <p class="sub">כאן את בונה כל הזמנה. הלקוח מקבל רק את עמוד ההזמנה — בלי גישה לפאנל.</p>
    </div>
    <div class="hactions">
      <span class="status" id="status" hidden></span>
      <button class="btn" onclick="exportJson()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        גיבוי
      </button>
      <label class="btn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        שחזור
        <input type="file" accept="application/json" hidden onchange="importJson(this)">
      </label>
      <button class="btn" onclick="downloadInvitation()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        הורדת ההזמנה
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:.6rem;padding:.7rem" onclick="addClient()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      לקוח חדש
    </button>
    <div id="list"></div>
  </aside>

  <main id="editor"></main>

  <div class="preview">
    <div class="bar">
      <span>תצוגה מקדימה — כך הלקוח יראה</span>
      <button class="btn" style="padding:.3rem .6rem;font-size:.78rem" onclick="openFull()">מסך מלא</button>
    </div>
    <iframe id="pv" title="תצוגה מקדימה"></iframe>
  </div>
</div>

<div class="full" id="full" hidden>
  <button class="btn close" onclick="closeFull()">
    <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    סגירה
  </button>
  <iframe id="pvFull" title="תצוגה מלאה"></iframe>
</div>

function adminKey(){ return localStorage.getItem('admin_key') || ""; }
function apiHeaders(){ return { "content-type": "application/json", "X-Admin-Key": adminKey() }; }

function askKey(msg){
  const k = prompt(msg || "סיסמת הניהול שהוגדרה ב-Cloudflare (ADMIN_KEY):");
  if(k){ localStorage.setItem('admin_key', k.trim()); return true; }
  return false;
}

async function loadClients(){
  try{
    const r = await fetch('/api/clients', { headers: apiHeaders() });
    if(r.status === 401){
      if(askKey()) return loadClients();
      clients = demoClients; active = clients[0].__slug;
      renderList(); renderEditor(); refreshPreview();
      return;
    }
    if(!r.ok) throw new Error("bad status");
    const data = await r.json();
    clients = (Array.isArray(data) && data.length) ? data : demoClients;
  }catch(e){
    clients = demoClients;
    flash("לא הצלחתי להתחבר לשרת — עובד במצב מקומי בלבד");
  }
  active = clients[0]?.__slug ?? "";
  renderList(); renderEditor(); refreshPreview();
}

    const r = await fetch('/api/clients', { method: "POST", headers: apiHeaders(), body: JSON.stringify(c) });
    if(r.status === 401){ if(askKey()) return saveActive(); throw new Error("unauthorized"); }
    if(!r.ok) throw new Error("bad status");
    flash("נשמר בשרת");
  }catch(e){
    flash("השמירה נכשלה — בדקי חיבור לאינטרנט או סיסמת ניהול");
  }
}

async function deleteActiveOnServer(slug){
  try{
    const r = await fetch('/api/clients/' + encodeURIComponent(slug), { method: "DELETE", headers: apiHeaders() });
    if(r.status === 401){ if(askKey()) return deleteActiveOnServer(slug); }
  }catch(e){ /* מתעלמים — מספיק שנמחק מקומית */ }
}

async function loadGuests(){
  const c = cur(); if(!c) return;
  try{
    const r = await fetch('/api/guests?slug=' + encodeURIComponent(c.__slug), { headers: apiHeaders() });
    if(r.status === 401){ if(askKey()) return loadGuests(); return; }
    if(!r.ok) throw new Error("bad status");
    const list = await r.json();
    if(!list.length){ alert("עדיין לא התקבלו ברכות מאורחים עבור " + c.__name); return; }
    alert(list.map(g => `${g.name}:\n${g.message}`).join("\n\n———\n\n"));
  }catch(e){
    flash("לא הצלחתי לטעון את הברכות");
  }
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function flash(msg){
  const el = document.getElementById('status');
  el.textContent = msg; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.hidden = true; }, 2800);
}
const slugify = v => v.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");

/* ===== בניית מסמך ההזמנה ===== */
function buildDoc(c){
  const d = {}; Object.keys(c).forEach(k => { if(!k.startsWith("__")) d[k] = c[k]; });
  return TPL.replace(/\/\*__DATA_START__\*\/[\s\S]*?\/\*__DATA_END__\*\//,
                     "const data = " + JSON.stringify(d) + ";");
}
let pvTimer = null;
function refreshPreview(){
  clearTimeout(pvTimer);
  pvTimer = setTimeout(()=>{ document.getElementById('pv').srcdoc = buildDoc(cur()); }, 250);
}
function openFull(){
  document.getElementById('pvFull').srcdoc = buildDoc(cur());
  document.getElementById('full').hidden = false;
}
function closeFull(){
  document.getElementById('full').hidden = true;
  document.getElementById('pvFull').srcdoc = "";
}
function downloadInvitation(){
  const c = cur();
  const blob = new Blob([buildDoc(c)], {type:"text/html;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hazmana-${c.__slug}.html`;
  a.click(); URL.revokeObjectURL(a.href);
  flash("ההזמנה ירדה — זה הקובץ שנשלח ללקוח");
}

/* ===== רשימת לקוחות ===== */
function renderList(){
  document.getElementById('list').innerHTML = clients.map(c => `
    <button class="cbtn ${c.__slug===active?'on':''}" onclick="select('${c.__slug}')">
      <span class="nm">${esc(c.__name)}</span>
      <span class="sl">/i/${esc(c.__slug)}</span>
      <span class="pill ${c.__published?'on':'off'}">${c.__published?'פורסם':'טיוטה'}</span>
    </button>`).join("");
}
function select(slug){ active = slug; renderList(); renderEditor(); refreshPreview(); }
function addClient(){
  const name = prompt("שם הלקוח (לשימוש פנימי):"); if(!name) return;
  const slug = slugify(prompt("כתובת ההזמנה (אנגלית):", slugify(name)) || ""); if(!slug) return;
  if(clients.some(c=>c.__slug===slug)){ alert("כתובת זו כבר תפוסה"); return; }
  clients.push(blank(slug, name)); select(slug);
  saveActive();
}
function removeClient(){
  if(!confirm("למחוק את ההזמנה?")) return;
  const slug = active;
  clients = clients.filter(c=>c.__slug!==slug);
  active = clients[0]?.__slug ?? "";
  renderList(); renderEditor(); refreshPreview();
  deleteActiveOnServer(slug);
}

/* ===== שדות ===== */
function set(key, value, rebuild){
  cur()[key] = value;
  if(key === "__name" || key === "__published" || key === "__slug") renderList();
  refreshPreview();
  if(rebuild) renderEditor();
}
const F = (label, key, hint, rows) => {
  const v = esc(cur()[key]);
  const input = rows
    ? `<textarea rows="${rows}" oninput="set('${key}',this.value)">${v}</textarea>`
    : `<input type="text" value="${v}" oninput="set('${key}',this.value)">`;
  return `<label class="f"><span>${label}</span>${input}${hint?`<span class="hint">${hint}</span>`:""}</label>`;
};
const FILE = (label, key, hint) => `
  <div class="f"><span>${label}</span>
    <label class="filebtn">
      <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      העלאת קובץ מהמחשב
      <input type="file" accept="image/*,.svg" hidden onchange="pick(this,'${key}')">
    </label>
    ${cur()[key] ? `<div class="strip"><img src="${esc(cur()[key])}" alt="">
      <button class="link" onclick="set('${key}','',true)">הסרה</button></div>` : ""}
    ${hint?`<span class="hint">${hint}</span>`:""}
  </div>`;
const SEC = (title, inner, open) =>
  `<details class="sec" ${open?"open":""}><summary>${title}</summary><div class="body">${inner}</div></details>`;

function pick(input, key){
  const f = input.files && input.files[0]; if(!f) return;
  if(f.size > 1200000) flash("הקובץ גדול — מומלץ להקטין לפני העלאה");
  const r = new FileReader();
  r.onload = () => set(key, String(r.result), true);
  r.readAsDataURL(f);
}

function renderEditor(){
  const c = cur(), host = document.getElementById('editor');
  if(!c){ host.innerHTML = `<div class="sec"><div class="body">בחרי לקוח או צרי חדש</div></div>`; return; }

  host.innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary" onclick="saveActive()">
        <svg class="ico" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></svg> שמירה
      </button>
      <button class="btn" onclick="set('__published', !cur().__published, true); saveActive()">
        ${c.__published ? "החזרה לטיוטה" : "פרסום ההזמנה"}
      </button>
      <button class="btn" onclick="loadGuests()">ברכות שהתקבלו</button>
      <button class="btn btn-danger" onclick="removeClient()">מחיקה</button>
      <span class="url">https://הדומיין-שלך/i/${esc(c.__slug)}</span>
    </div>

    ${SEC("פרטי הלקוח", `
      <label class="f"><span>שם פנימי</span>
        <input type="text" value="${esc(c.__name)}" oninput="set('__name',this.value)"></label>
      <label class="f"><span>כתובת ההזמנה</span>
        <input type="text" value="${esc(c.__slug)}" oninput="set('__slug',this.value)">
        <span class="hint">אותיות אנגליות, ספרות ומקפים בלבד</span></label>
    `, true)}

    ${SEC("רקע העמוד", FILE("תמונת רקע","backgroundImage","אם ריק — נעשה שימוש ברקע האטמוספרי המובנה") + `
      <label class="f"><span>עוצמת ההצללה — ${c.backgroundTint}%</span>
        <input type="range" min="0" max="100" value="${c.backgroundTint}" style="width:100%"
               oninput="set('backgroundTint', Number(this.value), true)">
        <span class="hint">ככל שהערך גבוה יותר, הרקע מעומעם והטקסט קריא יותר</span></label>`)}

    ${SEC("מסך פתיחה",
      F('בס"ד',"bsd") +
      FILE("מונוגרמה","monogramImage","PNG שקוף או SVG. במסך הפתיחה אין טקסט כלל — רק המונוגרמה והפסוק.") +
      F("הפסוק שסביב המונוגרמה","verse",null,3))}

    ${SEC("דפי ההזמנה",
      FILE("דף ראשון","invitationA","אם לא מעלים — הדף פשוט לא יוצג") +
      FILE("דף שני","invitationB"))}

    ${SEC("מועד וספירה",
      F("שורה 1 — היום","dayLabel","לדוגמה: יום חמישי") +
      F("שורה 2 — תאריך עברי","hebrewDate","לדוגמה: ט׳ בכסלו תשפ״ז") +
      F("שורה 3 — תאריך לועזי","gregorianDate","לדוגמה: 19.11.26") +
      F("מילת הספירה","countdownLabel") +
      F("תאריך יעד לספירה","targetDate","בפורמט 2026-11-19T19:00 — אם ריק, הספירה לא מוצגת") +
      F("ברכת ההורים","blessing",null,4) + F("שמות ההורים","hosts") +
      F("כפתור היומן","calendarLabel"))}

    ${SEC("השורה הגדולה + Save the date",
      F("שורת המתחתנים","marryingLine","מוצגת בענק מתחת לטיימר. הקונפטי המוזהב נורה כשמגיעים אליה.") +
      F("שורה באנגלית","saveTheDate","בפונט מתגלגל, עם אנימציה אות-אחר-אות"))}

    ${SEC("שלושת העיגולים",
      F("שאלה 1","whereQ","הצד הגלוי — רק השאלה") + F("מידע 1 (בגב)","whereInfo",null,3) + F("כפתור 1","whereBtn") +
      `<hr style="border:0;border-top:1px solid var(--line);margin:1rem 0">` +
      F("שאלה 2","whenQ") + F("מידע 2 (בגב)","whenInfo",null,3) + F("כפתור 2","whenBtn") +
      `<hr style="border:0;border-top:1px solid var(--line);margin:1rem 0">` +
      F("שאלה 3","howQ") + F("מידע 3 (בגב)","howInfo",null,3) + F("כפתור 3","howBtn"))}

    ${SEC("ברכות מהאורחים",
      F("כותרת הסקשן","greetTitle","אם ריק — סקשן הברכות לא מוצג") +
      F("תת-כותרת","greetSub"))}

    ${SEC("כפתור הסיום — פנייה אלייך",
      F("טקסט הכפתור","ctaText","מופיע בתחתית ההזמנה במקום שורת הסיום") +
      F("המייל שלך","ctaEmail","הכפתור יפתח מייל חדש לכתובת הזו. אם ריק — הכפתור לא מקושר."))}

    ${SEC("מוזיקה",
      F("קישור לקובץ המוזיקה","musicUrl","קישור ישיר ל-mp3. אם ריק — הפופ-אפ והנגן לא יוצגו כלל."))}
  `;
}

/* ===== גיבוי ===== */
function exportJson(){
  const blob = new Blob([JSON.stringify(clients, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = "clients.json"; a.click();
  URL.revokeObjectURL(a.href); flash("הגיבוי ירד");
}
function importJson(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(String(r.result));
      if(!Array.isArray(parsed)) throw 0;
      clients = parsed; active = clients[0]?.__slug ?? "";
      renderList(); renderEditor(); refreshPreview(); flash("היבוא הושלם");
    }catch{ flash("קובץ לא תקין"); }
  };
  r.readAsText(f);
}

loadClients();
</script>
</body>
</html>
